<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="地域のスポット情報をカードで集める・探す・行く。コレクションカード・ポータルサイト。" />
    <title>AMANEK machi FAVE | 地域を旅するコレクション</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- ヘッダー -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon"><img src="assets/logo.jpg" alt="AMANEK machi FAVE" /></span>
                <span class="logo-text">AMANEK machi FAVE</span>
            </a>
            <nav class="header-nav">
                <a href="index.html" class="nav-link active">カード一覧</a>
                <a href="map.html" class="nav-link">地図で見る</a>
            </nav>
            <button class="my-likes-toggle" id="myLikesToggle" type="button" aria-pressed="false" aria-label="MY LIKES を表示">
                <span class="my-likes-icon" aria-hidden="true"></span>
                <span class="my-likes-label">MY LIKES</span>
                <span class="my-likes-count" id="myLikesCount">0</span>
            </button>
            <div class="lang-switch lang-switch--header">
                <button class="lang-btn active" data-lang="ja">JP</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
            <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="mobile-nav" id="mobileNav">
            <a href="index.html" class="nav-link active">カード一覧</a>
            <a href="map.html" class="nav-link">地図で見る</a>
            <div class="lang-switch lang-switch--mobile">
                <button class="lang-btn active" data-lang="ja">JP</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </div>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">machica collection</h1>
            <p class="hero-sub">
                <span class="hero-sub-en">One card, one new experience.</span>
                <span class="hero-sub-ja">1枚のカードから、旅の新しい一歩を。</span>
            </p>
        </div>
    </section>

    <!-- 検索・フィルターセクション -->
    <section class="filter-section">
        <div class="filter-inner">
            <!-- キーワード検索 -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="スポット名・キーワードで検索…" />
                <button class="search-clear" id="searchClear" aria-label="クリア">✕</button>
            </div>
            <!-- ジャンルフィルター -->
            <div class="genre-filters" id="genreFilters">
                <button class="genre-btn active" data-genre="all">すべて</button>
                <!-- JSで動的生成 -->
            </div>
            <!-- エリアフィルター -->
            <div class="area-filter-wrap">
                <select class="area-select" id="areaSelect">
                    <option value="all">エリア（全国）</option>
                </select>
            </div>
        </div>
        <div class="result-count">
            <span id="resultCount">0</span>件のスポットが見つかりました
        </div>
    </section>

    <!-- カードグリッド -->
    <main class="cards-section">
        <!-- MY LIKES モード時のバナー -->
        <div class="my-likes-banner" id="myLikesBanner" style="display:none;">
            <span class="my-likes-banner-icon">♥</span>
            <span class="my-likes-banner-text">MY LIKES <span id="myLikesBannerCount">0</span> 件</span>
            <button class="my-likes-banner-close" id="myLikesBannerClose" type="button" aria-label="MY LIKES を閉じる">✕</button>
        </div>
        <div class="card-grid" id="cardGrid">
            <!-- JSで動的生成 -->
        </div>
        <div class="no-results" id="noResults" style="display:none;">
            <p>🔍 条件に合うスポットが見つかりませんでした</p>
            <button class="btn-secondary" onclick="resetFilters()">フィルターをリセット</button>
        </div>
        <div class="no-likes" id="noLikes" style="display:none;">
            <p>♡ まだLIKEしたカードがありません</p>
            <p style="font-size:0.85rem;color:var(--text-muted);">気に入ったカードを開いて LIKE を押すと、ここに表示されます。</p>
            <button class="btn-secondary" id="exitMyLikes">すべてのカードを見る</button>
        </div>
    </main>

    <!-- フッター -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-logo">
                <span class="logo-icon"><img src="assets/logo.jpg" alt="AMANEK machi FAVE" /></span>
                <span class="logo-text">AMANEK machi FAVE</span>
            </div>
            <div class="footer-meta">
                <a href="admin/index.html" class="footer-admin-link">管理画面</a>
                <p class="footer-copy">©AMANEK</p>
            </div>
        </div>
    </footer>

    <!-- カード詳細モーダル -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-container">
            <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>

            <!-- ギャラリーエリア -->
            <div class="modal-gallery-area">
                <div class="modal-main-image-wrap">
                    <img src="" alt="" class="modal-main-image" id="modalImage" />
                    <!-- 裏面がある場合の切り替えボタン（オーバーレイ） -->
                    <button id="flipBtn" class="flip-btn" style="display:none;">↻ 裏面を見る</button>
                    <span class="modal-badge" id="modalBadge"></span>
                </div>
                <!-- サムネイルリスト -->
                <div class="modal-thumbs" id="modalThumbs"></div>
            </div>

            <div class="modal-body">
                <div class="modal-meta">
                    <span class="modal-area" id="modalArea"></span>
                    <button class="like-btn like-btn--compact" id="likeBtn" type="button" aria-label="このスポットをLIKE" aria-pressed="false">
                        <span class="like-icon">♡</span>
                        <span class="like-label">LIKE</span>
                        <span class="like-count" id="likeCount">0</span>
                    </button>
                </div>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-description" id="modalDescription"></p>

                <!-- 店舗情報（住所＋OSM 由来 / 手動入力の営業時間・電話・HPを統合） -->
                <div class="modal-business-info" id="modalBusinessInfo" style="display:none;"></div>

                <!-- Google Mapsプレビュー -->
                <div class="map-container" id="mapContainer">
                    <div class="map-placeholder" id="mapPlaceholder">
                        <span>🗺️</span>
                        <p>地図を読み込み中…</p>
                    </div>
                    <div id="googleMap" style="width:100%;height:100%;"></div>
                </div>

                <div class="modal-actions">
                    <a href="#" class="btn-primary" id="routeBtn" target="_blank" rel="noopener">
                        <span>📍</span> Google Mapsで見る
                    </a>
                    <button class="btn-secondary" id="shareBtn">
                        <span>📤</span> シェアする
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin/supabase-config.js"></script>
    <script src="admin/db.js"></script>
    <script src="admin/image-utils.js"></script>
    <script src="admin/migration.js"></script>
    <script src="data/categories.js"></script>
    <script src="data/areas.js"></script>
    <script src="data/cards.js"></script>
    <script src="app.js"></script>
</body>

</html>
