<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カード管理 | machica Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <style>
        .modal-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.5) !important;
            display: none !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 9999 !important;
            backdrop-filter: blur(4px) !important;
            /* スライド挙動を打ち消す */
            transform: none !important;
            transition: none !important;
        }

        .modal-overlay.active {
            display: flex !important;
        }
    </style>
    <script src="auth.js"></script>
</head>

<body>

    <!-- サイドバー -->
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <span>🗾</span>
            <span>machica</span>
            <span style="font-size:0.7rem;font-weight:500;color:#A1A3A0;margin-left:auto;">Admin</span>
        </div>
        <nav class="sidebar-nav">
            <p class="sidebar-section-label">メニュー</p>
            <a href="index.html" class="sidebar-link">📊 ダッシュボード</a>
            <a href="cards.html" class="sidebar-link active">🃏 カード管理</a>
            <a href="cards-new.html" class="sidebar-link">➕ カード登録</a>
            <a href="cards-scan.html" class="sidebar-link" style="display:none;">📷 スキャン登録</a><a href="categories.html" class="sidebar-link">🏷️ カテゴリー管理</a>
            <a href="areas.html" class="sidebar-link">🌐 エリア管理</a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html">🌐 公開サイトを見る</a>
        </div>
    </aside>

    <!-- コンテンツ -->
    <div class="admin-content">
        <header class="admin-topbar">
            <span class="topbar-title">カード管理</span>
            <div class="topbar-actions">
                <a href="cards-new.html" class="btn-primary">＋ カードを登録</a>
            </div>
        </header>

        <main class="admin-main">
            <div class="page-header">
                <div class="page-header-text">
                    <h1>カード管理</h1>
                    <p>登録済みスポットの確認・編集・削除ができます</p>
                </div>
            </div>

            <!-- テーブル -->
            <div class="table-section">
                <div class="table-header">
                    <span class="table-title">スポット一覧 (<span id="cardCountLabel">0</span>件)</span>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <input type="text" id="adminSearch" class="form-control" placeholder="検索…"
                            style="width:200px;padding:8px 12px;font-size:0.85rem;" />
                    </div>
                </div>
                <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;">
                    💡 左の <span style="display:inline-block;color:var(--text-secondary);font-weight:700;">⋮⋮</span>
                    をドラッグして並び順を変更できます（公開サイトの表示順にも反映されます）。
                </p>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="adminCardTable">
                        <thead>
                            <tr>
                                <th style="width:32px;"></th>
                                <th style="width:60px;">写真</th>
                                <th>スポット名</th>
                                <th>ジャンル</th>
                                <th>エリア</th>
                                <th>住所</th>
                                <th style="width:120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminCardTbody">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 削除確認モーダル -->
    <div class="modal-overlay" id="deleteModal" style="display:none;">
        <div
            style="background:white;border-radius:16px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.15);">
            <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:12px;color:#1E1B19;">このスポットを削除しますか？</h3>
            <p style="color:#5A5854;font-size:0.9rem;margin-bottom:24px;" id="deleteConfirmText"></p>
            <div style="display:flex;gap:12px;justify-content:flex-end;">
                <button class="btn-secondary" id="deleteCancelBtn">キャンセル</button>
                <button class="btn-primary" id="deleteConfirmBtn"
                    style="background:#EF4444;box-shadow:0 2px 10px rgba(239,68,68,0.3);">削除する</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="db.js"></script>
    <script src="migration.js"></script>
    <script src="../data/categories.js"></script>
    <script src="../data/areas.js"></script>
    <script src="../data/cards.js"></script>
    <script src="admin-cards.js"></script>
</body>

</html>
