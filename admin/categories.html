<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カテゴリー管理 | machica Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <style>
        .category-icon-cell {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #E2E8F0;
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            overflow: hidden;
            background: #F8FAFC;
        }

        .category-icon-cell:hover,
        .category-icon-cell.drag-over {
            border-color: var(--primary);
            background: #EFF6FF;
        }

        .category-icon-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drop-hint {
            position: absolute;
            font-size: 0.6rem;
            color: var(--primary);
            bottom: 2px;
            font-weight: 700;
            display: none;
        }

        .category-icon-cell:hover .drop-hint {
            display: block;
        }
    </style>
    <script src="auth.js"></script>
</head>

<body>

    <!-- サイドバー -->
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <span>🗾</span>
            <span>machica</span>
            <span style="font-size:0.7rem;font-weight:500;color:#94A3B8;margin-left:auto;">Admin</span>
        </div>
        <nav class="sidebar-nav">
            <p class="sidebar-section-label">メニュー</p>
            <a href="index.html" class="sidebar-link">📊 ダッシュボード</a>
            <a href="cards.html" class="sidebar-link">🃏 カード管理</a>
            <a href="cards-new.html" class="sidebar-link">➕ カード登録</a>
            <a href="cards-scan.html" class="sidebar-link" style="display:none;">📷 スキャン登録</a><a href="categories.html" class="sidebar-link active">🏷️ カテゴリー管理</a>
            <a href="areas.html" class="sidebar-link">🌐 エリア管理</a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html">🌐 公開サイトを見る</a>
        </div>
    </aside>

    <!-- コンテンツ -->
    <div class="admin-content">
        <header class="admin-topbar">
            <span class="topbar-title">カテゴリー管理</span>
        </header>

        <main class="admin-main">
            <div class="page-header">
                <div class="page-header-text">
                    <h1>カテゴリー管理</h1>
                    <p>ジャンルの名称、色、アイコンを管理できます。</p>
                </div>
            </div>

            <!-- カテゴリー追加/編集フォーム -->
            <div class="form-card" style="margin-bottom:24px;">
                <p class="form-section-title" id="formTitle">➕ 新規カテゴリー追加</p>
                <form id="categoryForm"
                    style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; align-items:flex-end;">
                    <input type="hidden" id="editCategoryId" value="" />
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label" for="categoryName">ジャンル名 (日) <span class="required">*</span></label>
                        <input type="text" id="categoryName" class="form-control" placeholder="例：温泉" required />
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label" for="categoryNameEn">Name (En) <span class="required">*</span></label>
                        <input type="text" id="categoryNameEn" class="form-control" placeholder="Ex: Onsen" required />
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label" for="categoryColor">テーマカラー <span class="required">*</span></label>
                        <div style="display:flex; gap:8px;">
                            <input type="color" id="categoryColor" class="form-control" style="width:50px; padding:2px;"
                                value="#4A90D9" required />
                            <input type="text" id="categoryColorHex" class="form-control" placeholder="#4A90D9"
                                value="#4A90D9" />
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button type="submit" class="btn-primary" id="submitBtn"
                            style="height:42px; flex:1;">追加する</button>
                        <button type="button" class="btn-secondary" id="cancelEditBtn"
                            style="height:42px; display:none;">取消</button>
                    </div>
                </form>
            </div>

            <!-- カテゴリーテーブル -->
            <div class="table-section">
                <div class="table-header">
                    <span class="table-title">ジャンル一覧</span>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin-left:12px;">
                        ※アイコンを画像にするには、現在のアイコン部分に写真をドロップしてください。</p>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:60px;">ID</th>
                                <th style="width:80px;">アイコン</th>
                                <th>ジャンル名</th>
                                <th>英語名</th>
                                <th>カラー</th>
                                <th style="width:140px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTbody">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">カテゴリーの削除</h3>
            </div>
            <div class="modal-body">
                <p id="deleteConfirmText"></p>
                <p style="color:var(--danger);font-size:0.8rem;margin-top:8px;">※このカテゴリーに所属しているカードの表示が正しくなくなる可能性があります。
                </p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="deleteCancelBtn">キャンセル</button>
                <button class="btn-primary danger" id="deleteConfirmBtn">削除する</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="db.js"></script>
    <script src="image-utils.js"></script>
    <script src="migration.js"></script>
    <script src="../data/categories.js"></script>
    <script src="../data/cards.js"></script>
    <script src="admin-categories.js"></script>
</body>

</html>
