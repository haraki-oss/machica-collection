<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>エリア管理 | machica Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <script src="auth.js"></script>
</head>

<body>

    <!-- サイドバー -->
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <span>🗾</span>
            <span>machica</span>
            <span style="font-size:0.7rem;font-weight:500;color:#94A3B8;margin-left:auto;">Admin</span>
        </div>
        <nav class="sidebar-nav">
            <p class="sidebar-section-label">メニュー</p>
            <a href="index.html" class="sidebar-link">📊 ダッシュボード</a>
            <a href="cards.html" class="sidebar-link">🃏 カード管理</a>
            <a href="cards-new.html" class="sidebar-link">➕ カード登録</a>
            <a href="cards-scan.html" class="sidebar-link" style="display:none;">📷 スキャン登録</a><a href="categories.html" class="sidebar-link">🏷️ カテゴリー管理</a>
            <a href="areas.html" class="sidebar-link active">🌐 エリア管理</a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html">🌐 公開サイトを見る</a>
        </div>
    </aside>

    <!-- コンテンツ -->
    <div class="admin-content">
        <header class="admin-topbar">
            <span class="topbar-title">エリア管理</span>
        </header>

        <main class="admin-main">
            <div class="page-header">
                <div class="page-header-text">
                    <h1>エリア管理</h1>
                    <p>カードの所属エリアを追加・編集・削除できます。</p>
                </div>
            </div>

            <!-- エリア追加フォーム -->
            <div class="form-card" style="margin-bottom:24px;">
                <p class="form-section-title">➕ 新規エリア追加</p>
                <form id="addAreaForm" style="display:flex; gap:12px; align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0; flex:1;">
                        <label class="form-label" for="areaName">エリア名 (日本語) <span class="required">*</span></label>
                        <input type="text" id="areaName" class="form-control" placeholder="例：函館" required />
                    </div>
                    <div class="form-group" style="margin-bottom:0; flex:1;">
                        <label class="form-label" for="areaNameEn">Area Name (English) <span
                                class="required">*</span></label>
                        <input type="text" id="areaNameEn" class="form-control" placeholder="Ex: Hakodate" required />
                    </div>
                    <button type="submit" class="btn-primary" style="height:42px; padding:0 24px;">追加する</button>
                </form>
            </div>

            <!-- エリアテーブル -->
            <div class="table-section">
                <div class="table-header">
                    <span class="table-title">登録済みエリア一覧</span>
                    <span id="areaCountLabel" class="badge">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:100px;">ID</th>
                                <th>エリア名 (日本語)</th>
                                <th>Area Name (English)</th>
                                <th style="width:120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="areaTbody">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 削除確認モーダル（簡易版） -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">エリアの削除</h3>
            </div>
            <div class="modal-body">
                <p id="deleteConfirmText"></p>
                <p style="color:var(--danger);font-size:0.8rem;margin-top:8px;">※このエリアに所属しているカードのエリア情報は維持されます。</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="deleteCancelBtn">キャンセル</button>
                <button class="btn-primary danger" id="deleteConfirmBtn">削除する</button>
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">エリアの編集</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="editAreaName">エリア名 (日本語) <span class="required">*</span></label>
                    <input type="text" id="editAreaName" class="form-control" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="editAreaNameEn">Area Name (English) <span
                            class="required">*</span></label>
                    <input type="text" id="editAreaNameEn" class="form-control" required />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="editCancelBtn">キャンセル</button>
                <button class="btn-primary" id="editSaveBtn">保存する</button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="migration.js"></script>
    <script src="../data/areas.js"></script>
    <script src="admin-areas.js"></script>
</body>

</html>
