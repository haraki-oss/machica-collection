<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理ダッシュボード | machica Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="auth.js"></script>
</head>

<body>

    <!-- サイドバー -->
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <span>🗾</span>
            <span>machica</span>
            <span style="font-size:0.7rem;font-weight:500;color:#A1A3A0;margin-left:auto;">Admin</span>
        </div>
        <nav class="sidebar-nav">
            <p class="sidebar-section-label">メニュー</p>
            <a href="index.html" class="sidebar-link active">📊 ダッシュボード</a>
            <a href="cards.html" class="sidebar-link">🃏 カード管理</a>
            <a href="cards-new.html" class="sidebar-link">➕ カード登録</a>
            <a href="cards-scan.html" class="sidebar-link" style="display:none;">📷 スキャン登録</a><a href="categories.html" class="sidebar-link">🏷️ カテゴリー管理</a>
            <a href="areas.html" class="sidebar-link">🌐 エリア管理</a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html">🌐 公開サイトを見る</a>
        </div>
    </aside>

    <!-- コンテンツ -->
    <div class="admin-content">
        <header class="admin-topbar">
            <span class="topbar-title">ダッシュボード</span>
            <div class="topbar-actions">
                <a href="cards-new.html" class="btn-primary">＋ カードを登録</a>
            </div>
        </header>

        <main class="admin-main">
            <div class="page-header">
                <div class="page-header-text">
                    <h1>ダッシュボード</h1>
                    <p>スポットカードの登録状況をひと目で確認できます</p>
                </div>
                <div class="dashboard-filter">
                    <label class="dashboard-filter-label" for="areaFilterSelect">📍 地域で絞り込み</label>
                    <select id="areaFilterSelect" class="dashboard-filter-select">
                        <option value="all">すべての地域</option>
                    </select>
                </div>
            </div>

            <!-- 統計 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-icon">🃏</div>
                    <span class="stat-card-label">総スポット数</span>
                    <span class="stat-card-value" id="statTotal">0</span>
                    <span class="stat-card-sub">登録済みカード</span>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">🏷️</div>
                    <span class="stat-card-label">ジャンル数</span>
                    <span class="stat-card-value">6</span>
                    <span class="stat-card-sub">飲食店・カフェ・地域食・観光・総合・体験</span>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">🗺️</div>
                    <span class="stat-card-label">対応エリア</span>
                    <span class="stat-card-value" id="statAreas">0</span>
                    <span class="stat-card-sub">都道府県</span>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">📷</div>
                    <span class="stat-card-label">写真あり</span>
                    <span class="stat-card-value" id="statWithImg">0</span>
                    <span class="stat-card-sub">写真付き</span>
                </div>
            </div>

            <!-- ジャンル別統計 -->
            <div class="table-section" style="margin-bottom:28px;">
                <div class="table-header">
                    <span class="table-title">ジャンル別 登録数</span>
                </div>
                <div style="padding:20px 24px;" id="genreStats">
                    <!-- JSで生成 -->
                </div>
            </div>

            <!-- LIKE数ベスト3（表彰台） -->
            <div class="table-section">
                <div class="table-header">
                    <span class="table-title">🏆 LIKE数ベスト3</span>
                    <a href="cards.html" class="btn-secondary">カード一覧</a>
                </div>
                <div style="padding:24px 16px 8px;">
                    <div class="podium" id="topLikedPodium"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin-account.js"></script>
    <script src="db.js"></script>
    <script src="migration.js"></script>
    <script src="../data/categories.js"></script>
    <script src="../data/areas.js"></script>
    <script src="../data/cards.js"></script>
    <script src="admin-dashboard.js"></script>
</body>

</html>
