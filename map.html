<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>地図で見る | AMANEK machi FAVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        .site-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        #map {
            width: 100%;
            height: 100vh;
            padding-top: var(--header-h);
            box-sizing: border-box;
            background: #FAFAF9;
        }

        /* ── カスタムマーカー（divIcon）─────────────────── */
        .amk-marker-wrap { background: transparent !important; border: none !important; }

        .amk-marker {
            position: relative;
            width: 44px;
            height: 54px;
            transform-origin: bottom center;
            transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.18s ease;
            cursor: pointer;
        }
        .amk-marker:hover { transform: scale(1.1); filter: brightness(1.05); }

        .amk-marker-pin {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            background: #1E1B19;
            border: 2.5px solid #fff;
            border-radius: 50%;
            box-shadow: 0 6px 16px rgba(30, 27, 25, 0.28),
                        0 2px 4px rgba(30, 27, 25, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .amk-marker-pin img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }
        .amk-marker-pin .amk-marker-emoji {
            font-size: 1.2rem;
            line-height: 1;
            color: #fff;
        }
        .amk-marker-tail {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 12px solid #1E1B19;
            filter: drop-shadow(0 2px 3px rgba(30, 27, 25, 0.22));
        }

        /* ── ポップアップ ───────────────────────────────── */
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(30, 27, 25, 0.18),
                        0 4px 12px rgba(30, 27, 25, 0.08);
            border: 1px solid var(--border);
        }
        .leaflet-popup-content { margin: 0; width: 220px !important; }
        .leaflet-popup-tip { box-shadow: 0 4px 8px rgba(30, 27, 25, 0.12); }

        .popup-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            font-family: 'Yu Gothic', 'YuGothic', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
        }
        .popup-info { padding: 16px 18px 16px; }
        .popup-area {
            margin: 0 0 6px 0;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .popup-title {
            margin: 0 0 14px 0;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--amanek-black, #1E1B19);
            line-height: 1.35;
            letter-spacing: 0.02em;
        }
        .popup-btn {
            display: block;
            width: 100%;
            padding: 9px 0;
            text-align: center;
            background: var(--amanek-black, #1E1B19);
            color: #fff;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.04em;
            transition: background 0.18s;
        }
        .popup-btn:hover { background: #000; }

        /* ── Leaflet コントロール（ズーム +/−）の見た目調整 ── */
        .leaflet-bar {
            border: 1px solid var(--border) !important;
            box-shadow: 0 4px 16px rgba(30, 27, 25, 0.1) !important;
        }
        .leaflet-bar a {
            background: #fff;
            color: var(--amanek-black, #1E1B19) !important;
            border-bottom-color: var(--border) !important;
        }
        .leaflet-bar a:hover {
            background: var(--bg-soft) !important;
        }

        /* タイル attribution */
        .leaflet-control-attribution {
            font-size: 0.65rem !important;
            background: rgba(255, 255, 255, 0.85) !important;
            color: var(--text-muted) !important;
        }
    </style>
</head>

<body>
    <!-- ヘッダー -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon"><img src="assets/logo.jpg" alt="AMANEK machi FAVE" /></span>
                <span class="logo-text">AMANEK machi FAVE</span>
            </a>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">カード一覧</a>
                <a href="map.html" class="nav-link active">地図で見る</a>
            </nav>
            <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="mobile-nav" id="mobileNav">
            <a href="index.html" class="nav-link">カード一覧</a>
            <a href="map.html" class="nav-link active">地図で見る</a>
        </div>
    </header>

    <!-- マップコンテナ -->
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin/supabase-config.js"></script>
    <script src="admin/db.js"></script>
    <script src="admin/migration.js"></script>
    <script src="data/categories.js"></script>
    <script src="data/areas.js"></script>
    <script src="data/cards.js"></script>
    <script src="map-app.js"></script>
</body>

</html>
