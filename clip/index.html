<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machica Clip</title>
    
    <!-- Google Fonts: Afacad & Zen Kaku Gothic New -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ciel: {
                            300: '#92bece',
                            350: '#71a8bc',
                            400: '#457b9d',
                            500: '#417f96',
                        },
                        backgr: '#e4ecef',
                        primary: '#457b9d', // machica-collectionと合わせるためのメインカラー
                    },
                    fontFamily: {
                        sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
                        afacad: ['Afacad', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-afacad font-bold text-ciel-500 cursor-pointer" id="logo-btn">machica clip</h1>
            <nav>
                <button id="nav-login-btn" class="text-sm font-medium text-gray-500 hover:text-ciel-500 hidden">ログイン</button>
                <div id="nav-user-menu" class="hidden flex items-center gap-2">
                    <span class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-sm overflow-hidden" id="nav-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                    </span>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content Area (SPA Router Targets) -->
    <main class="flex-grow max-w-md mx-auto w-full p-4 relative" id="app-root">
        
        <!-- View: Login -->
        <section id="view-login" class="view-section hidden flex flex-col items-center justify-center min-h-[70vh]">
            <div class="bg-white p-8 rounded-3xl shadow-sm w-full max-w-sm text-center">
                <h2 class="text-xl font-bold mb-6 text-gray-700">ログイン</h2>
                <div class="space-y-4">
                    <input type="email" id="login-email" placeholder="メールアドレス" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-ciel-300 bg-gray-50">
                    <input type="password" id="login-password" placeholder="パスワード" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-ciel-300 bg-gray-50">
                    <button id="login-submit-btn" class="w-full bg-ciel-400 hover:bg-ciel-500 text-white font-medium py-3 rounded-full transition-colors mt-2">ログイン</button>
                </div>
                <p class="mt-6 text-sm text-gray-500">アカウントをお持ちでない場合は<a href="#" id="go-register-btn" class="text-ciel-400 font-medium">新規登録</a></p>
            </div>
        </section>

        <!-- View: My Page (Lists) -->
        <section id="view-mypage" class="view-section hidden">
            <!-- Profile Section -->
            <div class="bg-white rounded-3xl p-5 mb-6 shadow-sm flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-gray-200 flex-shrink-0 flex items-center justify-center overflow-hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="text-gray-400 w-8 h-8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                </div>
                <div class="flex-grow">
                    <h2 class="text-lg font-bold text-gray-800" id="profile-name">No Name</h2>
                    <p class="text-sm text-gray-400" id="profile-id">@user_clip</p>
                </div>
                <button class="text-ciel-400 p-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg></button>
            </div>

            <!-- Lists Header -->
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="text-xl font-afacad text-ciel-500">my list</h3>
                <div class="flex gap-2">
                    <button class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center text-ciel-400 bg-white shadow-sm hover:bg-gray-50">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>
                    </button>
                    <button class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center text-ciel-400 bg-white shadow-sm hover:bg-gray-50" id="create-list-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    </button>
                </div>
            </div>

            <!-- Lists Grid -->
            <div class="grid grid-cols-2 gap-3" id="lists-container">
                <!-- List Items will be injected here -->
            </div>
        </section>
        
        <!-- View: List Detail (Cards in List) -->
        <section id="view-list-detail" class="view-section hidden">
            <div class="flex items-center gap-3 mb-6">
                <button id="list-detail-back-btn" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-500 hover:text-ciel-500 transition-colors flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                </button>
                <h2 class="text-xl font-bold text-gray-800 flex-grow truncate" id="list-detail-title">リスト名</h2>
                <button id="list-detail-edit-btn" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-ciel-400 hover:text-ciel-500 transition-colors flex-shrink-0" aria-label="リスト名を編集">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg>
                </button>
                <button id="list-detail-delete-btn" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-red-400 hover:text-red-500 transition-colors flex-shrink-0" aria-label="リストを削除">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4" id="list-cards-container">
                <!-- Cards will be injected here -->
            </div>

            <!-- Empty State -->
            <div id="list-cards-empty" class="hidden text-center py-20">
                <div class="text-gray-300 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 mx-auto"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
                </div>
                <p class="text-gray-400">まだカードがありません</p>
                <button class="mt-4 text-ciel-400 font-medium text-sm" onclick="window.location.hash='#mypage'">マイページに戻る</button>
            </div>
        </section>

        <!-- View: Card Detail (Tap a clipped card from list detail) -->
        <section id="view-card-detail" class="view-section hidden">
            <!-- Header -->
            <div class="flex items-center gap-3 mb-4">
                <button id="card-detail-back-btn" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-500 hover:text-ciel-500 transition-colors flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                </button>
                <div class="min-w-0">
                    <p class="text-[11px] text-gray-400 leading-none mb-1">クリップ元のリスト</p>
                    <p id="card-detail-list-name" class="text-sm font-medium text-gray-700 truncate">リスト</p>
                </div>
            </div>

            <!-- Hero Image -->
            <div class="aspect-[4/5] bg-gray-100 rounded-3xl overflow-hidden shadow-sm mb-5">
                <img id="card-detail-image" src="" alt="" class="w-full h-full object-cover">
            </div>

            <!-- Title / Meta -->
            <div class="bg-white rounded-3xl p-5 shadow-sm mb-4">
                <div class="flex items-center gap-2 flex-wrap mb-2 text-xs">
                    <span id="card-detail-area" class="font-bold text-ciel-500"></span>
                    <span id="card-detail-divider" class="text-gray-300 hidden">|</span>
                    <span id="card-detail-recommender" class="text-gray-500"></span>
                </div>
                <h2 id="card-detail-title" class="text-xl font-bold text-gray-800 leading-tight mb-2">タイトル</h2>
                <p id="card-detail-description" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line"></p>
            </div>

            <!-- Business Info -->
            <div id="card-detail-bizinfo" class="bg-white rounded-3xl p-5 shadow-sm mb-4 hidden">
                <h3 class="text-[11px] font-bold text-gray-400 tracking-wider uppercase mb-3">店舗情報</h3>
                <div class="space-y-3 text-sm" id="card-detail-bizinfo-list">
                    <!-- Rows injected -->
                </div>
            </div>

            <!-- Map -->
            <div id="card-detail-map-wrap" class="bg-white rounded-3xl overflow-hidden shadow-sm mb-4 hidden">
                <iframe id="card-detail-map-iframe" class="w-full aspect-[4/3] block" frameborder="0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <!-- Actions -->
            <div class="flex gap-3 mb-3">
                <a id="card-detail-open-source" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 bg-ciel-400 hover:bg-ciel-500 text-white font-medium py-3 rounded-full text-center transition-colors shadow-sm">
                    コレクションで開く
                </a>
                <button id="card-detail-remove-btn" class="px-5 bg-white hover:bg-red-50 text-red-500 font-medium py-3 rounded-full border border-red-200 transition-colors">
                    削除
                </button>
            </div>

            <!-- Clip date -->
            <p id="card-detail-clip-date" class="text-xs text-gray-400 text-center mb-6"></p>

            <!-- Loading / Error -->
            <div id="card-detail-loading" class="hidden text-center py-8 text-gray-400 text-sm">読み込み中...</div>
            <div id="card-detail-error" class="hidden text-center py-8 text-gray-400 text-sm">カードが見つかりませんでした。</div>
        </section>

        <!-- View: Add Card (External Entry Point) -->
        <section id="view-add" class="view-section hidden flex flex-col items-center justify-center min-h-[70vh]">
            <div class="bg-white p-6 rounded-3xl shadow-sm w-full max-w-sm">
                <div class="text-center mb-6">
                    <span class="inline-block bg-ciel-50 text-ciel-500 px-3 py-1 rounded-full text-xs font-bold mb-2">クリップに追加</span>
                    <h2 class="text-lg font-bold text-gray-800" id="add-card-title">カード名プレビュー</h2>
                </div>
                
                <div class="aspect-video bg-gray-100 rounded-xl mb-6 overflow-hidden relative shadow-inner">
                    <!-- Image Preview -->
                    <img id="add-card-image" src="" alt="Preview" class="w-full h-full object-cover hidden">
                    <div id="add-card-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-600 mb-2">保存先のリスト</label>
                    <select id="add-select-list" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-ciel-300 bg-gray-50 text-gray-700 font-medium">
                        <option value="">リストを選択...</option>
                        <option value="1">好きな街</option>
                    </select>
                </div>

                <div class="flex gap-3">
                    <button id="add-cancel-btn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium py-3 rounded-full transition-colors">キャンセル</button>
                    <button id="add-confirm-btn" class="flex-1 bg-ciel-400 hover:bg-ciel-500 text-white font-medium py-3 rounded-full transition-colors shadow-sm">保存する</button>
                </div>
            </div>
        </section>

    </main>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
